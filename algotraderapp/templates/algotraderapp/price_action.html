<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price Action Bricks</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0b1220; color: #e5e7eb; }
    main { width: min(1100px, calc(100% - 32px)); margin: 32px auto; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0; color: #94a3b8; }
    label { display: grid; gap: 7px; color: #94a3b8; font-size: 13px; }
    select { min-width: 260px; padding: 10px 12px; border: 1px solid #334155; border-radius: 8px; background: #111827; color: #fff; }
    .meta { display: flex; gap: 22px; margin: 24px 0 16px; padding: 14px 16px; background: #111827; border: 1px solid #1f2937; border-radius: 10px; flex-wrap: wrap; }
    .meta span { color: #94a3b8; }
    .meta strong { color: #f8fafc; margin-left: 6px; }
    #status::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; background: #64748b; }
    #status[data-kind="fetching"] { color: #fde68a; }
    #status[data-kind="fetching"]::before { background: #f59e0b; animation: pulse 1s ease-in-out infinite; }
    #status[data-kind="live"] { color: #86efac; }
    #status[data-kind="live"]::before { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.14); }
    #status[data-kind="stopped"] { color: #cbd5e1; }
    #status[data-kind="error"] { color: #fca5a5; }
    #status[data-kind="error"]::before { background: #ef4444; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
    #bricks { height: 430px; padding: 24px; overflow: scroll; scrollbar-gutter: stable; scrollbar-color: #64748b #111827; background: #111827; border: 1px solid #1f2937; border-radius: 10px; }
    .chart-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .chart-controls button { padding: 8px 14px; border: 1px solid #64748b; border-radius: 6px; background: #1f2937; color: white; cursor: pointer; }
    .chart-controls label { display: flex; align-items: center; gap: 6px; }
    #bricks:focus-visible { outline: 2px solid #60a5fa; }
    #bricks::-webkit-scrollbar { width: 14px; height: 14px; }
    #bricks::-webkit-scrollbar-thumb { background: #64748b; border: 3px solid #111827; border-radius: 7px; }
    #bricks::-webkit-scrollbar-corner { background: #111827; }
    .track { position: relative; min-height: 100%; }
    .brick { position: absolute; width: 74px; box-sizing: border-box; padding: 6px 4px; display: grid; place-content: center; text-align: center; border: 1px solid rgba(255,255,255,.24); border-radius: 3px; color: white; font-size: 12px; font-weight: 700; }
    .green { background: #15803d; }
    .red { background: #b91c1c; }
    .brick small { display: block; margin-top: 5px; opacity: .8; font-weight: 500; }
    .empty { height: 100%; display: grid; place-content: center; color: #64748b; }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Price Action Bricks</h1><p>Price-only data · refreshes every second</p></div>
    <label>Instrument
      <select id="instrument"><option value="">Loading instruments…</option></select>
    </label>
  </header>
  <div class="meta">
    <span>Status<strong id="status">Waiting</strong></span>
    <span>Base<strong id="base">—</strong></span>
    <span>Last price<strong id="lastPrice">—</strong></span>
    <span>Brick size<strong id="brickSize">—</strong></span>
    <span>Bricks<strong id="count">0</strong></span>
  </div>
  <div class="chart-controls">
    <button id="older" type="button">&larr; Older</button>
    <button id="newer" type="button">Newer &rarr;</button>
    <button id="latest" type="button">Latest brick</button>
    <label><input id="follow" type="checkbox"> Follow latest</label>
    <span>Scroll sideways for history and vertically for price levels.</span>
  </div>
  <section id="bricks" tabindex="0" aria-label="Price bricks, scroll horizontally and vertically"><div class="empty">Select an instrument</div></section>
</main>
<script>
  const select = document.querySelector('#instrument');
  const bricks = document.querySelector('#bricks');
  const status = document.querySelector('#status');
  let requestRunning = false;
  const follow = document.querySelector('#follow');
  let lastRendered = null;
  let previousChartHeight = 0;
  let previousMinimum = null;
  function showLatest() {
    const latest = bricks.querySelector('.brick:last-child');
    if (!latest) return;
    bricks.scrollLeft = bricks.scrollWidth;
    bricks.scrollTop = latest.offsetTop - bricks.clientHeight / 2 + latest.offsetHeight / 2 + 24;
  }
  document.querySelector('#older').onclick = () => { follow.checked = false; bricks.scrollBy({left: -bricks.clientWidth * .8}); };
  document.querySelector('#newer').onclick = () => { follow.checked = false; bricks.scrollBy({left: bricks.clientWidth * .8}); };
  document.querySelector('#latest').onclick = showLatest;
  follow.onchange = () => { if (follow.checked) showLatest(); };
  for (const event of ['wheel', 'pointerdown', 'touchstart', 'keydown']) {
    bricks.addEventListener(event, () => { follow.checked = false; }, {passive: true});
  }

  const setText = (id, value) => document.querySelector(id).textContent = value ?? '—';

  async function loadInstruments() {
    try {
      const response = await fetch('../api/price-action/instruments/');
      if (!response.ok) throw new Error('Could not load instruments');
      const { instruments } = await response.json();
      select.innerHTML = '<option value="">Select instrument</option>' + instruments.map(item =>
        `<option value="${item.instrument_token}">${item.trading_symbol} (${item.instrument_token})</option>`
      ).join('');
    } catch (error) {
      select.innerHTML = '<option value="">Instruments unavailable</option>';
      showError(error.message);
    }
  }

  function showError(message) {
    status.textContent = message;
    status.dataset.kind = 'error';
  }

  function renderBricks(items) {
    const signature = JSON.stringify(items);
    if (signature === lastRendered) return;
    lastRendered = signature;
    const left = bricks.scrollLeft;
    const top = bricks.scrollTop;
    if (!items.length) {
      bricks.innerHTML = '<div class="empty">Waiting for the first completed brick…</div>';
      return;
    }
    const prices = items.flatMap(item => [Number(item.open), Number(item.close)]);
    const minimum = prices.reduce((a, b) => Math.min(a, b), Infinity);
    const maximum = prices.reduce((a, b) => Math.max(a, b), -Infinity);
    const brickSize = Number(items[0].brick_size) || 1;
    const levelCount = Math.max(1, Math.round((maximum - minimum) / brickSize));
    const levelHeight = 54;
    const chartHeight = Math.max(350, (levelCount + 2) * levelHeight);
    const chartWidth = Math.max(bricks.clientWidth - 48, items.length * 80 + 30);
    bricks.innerHTML = `<div class="track" style="height:${chartHeight}px;width:${chartWidth}px">${items.map((brick, index) => {
      const low = Math.min(Number(brick.open), Number(brick.close));
      const bottom = ((low - minimum) / brickSize) * levelHeight + levelHeight;
      const title = `${brick.type}: ${brick.open} → ${brick.close}`;
      return `<div class="brick ${brick.direction}" style="left:${index * 80}px;bottom:${bottom}px;height:${levelHeight}px" title="${title}">${brick.close}<small>${brick.type}</small></div>`;
    }).join('')}</div>`;
    bricks.scrollLeft = left;
    // Preserve the price level being viewed when the chart's range expands.
    bricks.scrollTop = previousMinimum === null ? top : top + chartHeight - previousChartHeight + (minimum - previousMinimum) / brickSize * levelHeight;
    previousChartHeight = chartHeight;
    previousMinimum = minimum;
    if (follow.checked) showLatest();
  }

  async function refresh() {
    const token = select.value;
    if (!token || requestRunning) return;
    requestRunning = true;
    status.textContent = 'Fetching…';
    status.dataset.kind = 'fetching';
    try {
      const response = await fetch(`../api/price-action/bricks/?instrument_token=${encodeURIComponent(token)}`, { cache: 'no-store' });
      const data = await response.json();
      if (token !== select.value) return;
      if (!response.ok) throw new Error(data.error || 'Fetch failed');
      const updatedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      status.textContent = data.running ? `Live · updated ${updatedAt}` : `Stopped · checked ${updatedAt}`;
      status.dataset.kind = data.running ? 'live' : 'stopped';
      setText('#base', data.base_price);
      setText('#lastPrice', data.last_price);
      setText('#brickSize', data.brick_size);
      setText('#count', data.bricks.length);
      renderBricks(data.bricks);

    } catch (error) {
      showError(error.message);
    } finally {
      requestRunning = false;
    }
  }

  select.addEventListener('change', () => {
    lastRendered = null;
    previousChartHeight = 0;
    previousMinimum = null;
    bricks.scrollLeft = 0;
    bricks.scrollTop = 0;
    bricks.innerHTML = '<div class="empty">Waiting for data…</div>';
    refresh();
  });
  loadInstruments();
  setInterval(refresh, 1000);
</script>
</body>
</html>
